<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="30%" stop-color="#D4A373"/>
      <stop offset="60%" stop-color="#C49A6C"/>
      <stop offset="100%" stop-color="#A07850"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFCF5"/>
      <stop offset="50%" stop-color="#F5F0E0"/>
      <stop offset="100%" stop-color="#EDE5D0"/>
    </linearGradient>
    <linearGradient id="pageEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8E0CC"/>
      <stop offset="50%" stop-color="#F0EAD8"/>
      <stop offset="100%" stop-color="#DDD5C0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="8" dy="12" stdDeviation="16" flood-color="#2B2B2B" flood-opacity="0.18"/>
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#D4A373" flood-opacity="0.12"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drop shadow layers -->
  <ellipse cx="150" cy="388" rx="100" ry="18" fill="#2B2B2B" opacity="0.12" filter="url(#shadow)"/>
  <ellipse cx="150" cy="382" rx="85" ry="14" fill="#2B2B2B" opacity="0.08" filter="url(#shadow)"/>

  <!-- Book body -->
  <g transform="rotate(-8 150 200)">
    <!-- Cover -->
    <rect x="40" y="30" width="220" height="340" rx="12" fill="url(#coverGrad)" filter="url(#shadow)"/>
    <!-- Cover border inset -->
    <rect x="40" y="30" width="220" height="340" rx="12" fill="none" stroke="#D4A373" stroke-width="1" opacity="0.35"/>

    <!-- Spine -->
    <rect x="40" y="30" width="28" height="340" rx="12" fill="url(#spineGrad)"/>
    <!-- Spine highlight edge -->
    <rect x="40" y="30" width="3" height="340" rx="1.5" fill="#F5EDD5" opacity="0.5"/>
    <!-- Spine ribs -->
    <line x1="40" y1="80" x2="68" y2="80" stroke="#7A5C20" stroke-width="1.5" opacity="0.25"/>
    <line x1="40" y1="140" x2="68" y2="140" stroke="#7A5C20" stroke-width="1.5" opacity="0.25"/>
    <line x1="40" y1="200" x2="68" y2="200" stroke="#7A5C20" stroke-width="1.5" opacity="0.25"/>
    <line x1="40" y1="260" x2="68" y2="260" stroke="#7A5C20" stroke-width="1.5" opacity="0.25"/>
    <line x1="40" y1="320" x2="68" y2="320" stroke="#7A5C20" stroke-width="1.5" opacity="0.25"/>

    <!-- Page edges (right side) -->
    <rect x="258" y="42" width="8" height="316" rx="0 4 4 0" fill="url(#pageEdge)" opacity="0.9"/>

    <!-- Cover interior content -->
    <!-- Decorative rule top -->
    <line x1="88" y1="80" x2="232" y2="80" stroke="#D4A373" stroke-width="0.5" opacity="0.4"/>

    <!-- Logo icon -->
    <g transform="translate(130 95)">
      <path d="M10 2C10 2 3 7 3 13C3 17.4 6.1 20 10 20C13.9 20 17 17.4 17 13C17 7 10 2 10 2Z" fill="#D4A373" opacity="0.4"/>
      <path d="M10 8C10 8 6 11 6 14C6 15.8 7.8 17 10 17C12.2 17 14 15.8 14 14C14 11 10 8 10 8Z" fill="#D4A373"/>
    </g>

    <!-- A Memory Book label -->
    <text x="160" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="600" letter-spacing="2" fill="#D4A373" opacity="0.9">A MEMORY BOOK</text>

    <!-- Title -->
    <text x="160" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="500" fill="#2B2B2B">The Family Story</text>

    <!-- Decorative divider -->
    <line x1="88" y1="210" x2="130" y2="210" stroke="#D4A373" stroke-width="0.5" opacity="0.25"/>
    <circle cx="160" cy="210" r="3" fill="#D4A373" opacity="0.4"/>
    <line x1="190" y1="210" x2="232" y2="210" stroke="#D4A373" stroke-width="0.5" opacity="0.25"/>

    <!-- Content lines (editorial style) -->
    <rect x="88" y="228" width="140" height="2.5" rx="1.25" fill="#D4A373" opacity="0.22"/>
    <rect x="88" y="238" width="150" height="2.5" rx="1.25" fill="#D4A373" opacity="0.18"/>
    <rect x="88" y="248" width="120" height="2.5" rx="1.25" fill="#CCD5AE" opacity="0.4"/>
    <rect x="88" y="258" width="138" height="2.5" rx="1.25" fill="#D4A373" opacity="0.16"/>
    <rect x="88" y="268" width="90" height="2.5" rx="1.25" fill="#D4A373" opacity="0.2"/>
    <rect x="88" y="278" width="126" height="2.5" rx="1.25" fill="#D4A373" opacity="0.15"/>
    <rect x="88" y="288" width="105" height="2.5" rx="1.25" fill="#CCD5AE" opacity="0.35"/>
    <rect x="88" y="298" width="75" height="2.5" rx="1.25" fill="#D4A373" opacity="0.18"/>

    <!-- Photo mosaic -->
    <rect x="88" y="320" width="48" height="30" rx="4" fill="#D4A373" opacity="0.08"/>
    <rect x="142" y="320" width="48" height="30" rx="4" fill="#CCD5AE" opacity="0.12"/>
    <rect x="196" y="320" width="48" height="30" rx="4" fill="#D4A373" opacity="0.06"/>
  </g>
</svg>